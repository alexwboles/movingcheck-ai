<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MovingCheck AI — your moving-day copilot</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brandmark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 8h13v9H1z"/><path d="M14 11h4l4 4v2h-8z"/><circle cx="6" cy="19" r="1.6"/><circle cx="17.5" cy="19" r="1.6"/></svg>
    </div>
    <div>
      <h1 class="brand">MovingCheck <span>AI</span></h1>
      <p class="tagline">Your complete moving-day command center — plan, pack, and settle in.</p>
    </div>
    <div class="datebar">
      <label for="moveDate">Moving date</label>
      <input type="date" id="moveDate">
      <button id="resetAll" class="danger ghost">Start over</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="moveHead" class="card hero"></section>

  <nav class="tabs" aria-label="Sections">
    <button id="tabbtn-plan" class="active" data-tab="plan">Countdown plan</button>
    <button id="tabbtn-boxes" data-tab="boxes">Boxes</button>
    <button id="tabbtn-movers" data-tab="movers">Movers</button>
  </nav>

  <section id="tab-plan"></section>
  <section id="tab-boxes" class="hidden"></section>
  <section id="tab-movers" class="hidden"></section>
</main>

<footer class="foot">
  <p>100% local — your move details never leave this browser. No account, no API keys.</p>
</footer>

<script src="js/movebank.js"></script>
<script src="js/logic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
